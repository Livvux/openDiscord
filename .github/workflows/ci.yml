name: CI

on:
  push:
    branches: [main]
    paths-ignore: ['docs/**', '*.md']
  pull_request:
    paths-ignore: ['docs/**', '*.md']

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    # Superseded runs should cancel, while genuine failures must still fail this gate.
    if: ${{ !cancelled() }}
    needs: [backend, browser, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Require every validation job
        env:
          BACKEND_RESULT: ${{ needs.backend.result }}
          BROWSER_RESULT: ${{ needs.browser.result }}
          DOCKER_RESULT: ${{ needs.docker.result }}
        run: |
          test "$BACKEND_RESULT" = success
          test "$BROWSER_RESULT" = success
          test "$DOCKER_RESULT" = success

  backend:
    strategy:
      fail-fast: false
      matrix:
        # Vitest files run serially against one database, so split them across runners.
        shard: [1, 2]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opendiscord
          POSTGRES_PASSWORD: opendiscord
          POSTGRES_DB: opendiscord
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opendiscord" --health-interval 5s --health-retries 10
    env:
      ATTACHMENT_DIR: /tmp/opendiscord-ci-attachments
      DATABASE_URL: postgres://opendiscord:opendiscord@localhost:5432/opendiscord
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
      # Integration tests only need the dev-mode LiveKit settings.
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Production dependency license inventory
        if: matrix.shard == 1
        run: node scripts/check-dependency-licenses.mjs
      - name: Dependency audit (production dependencies)
        if: matrix.shard == 1
        run: pnpm audit --prod --audit-level=high
      - name: Operator job shell syntax
        if: matrix.shard == 1
        run: bash -n scripts/production-backup.sh scripts/production-maintenance.sh scripts/production-voice-maintenance.sh scripts/secure-dokploy-env.sh
      - name: Operator alert state regression checks
        if: matrix.shard == 1
        run: |
          python3 scripts/test-operator-monitor.py
          python3 scripts/test-backup-capacity.py
          python3 scripts/test-production-smoke.py
          python3 scripts/test-capture-scanner-recovery.py
      - name: Voice operator wrapper isolation and cleanup
        if: matrix.shard == 1
        run: python3 scripts/test-production-voice-maintenance.py
      - name: Voice systemd template verification
        if: matrix.shard == 1
        run: |
          sudo install -m 755 /bin/true /usr/local/sbin/opendiscord-voice-maintenance
          sudo install -m 755 /bin/true /usr/local/sbin/opendiscord-operator-monitor
          systemd-analyze verify ops/voice-maintenance/*.service ops/voice-maintenance/*.timer ops/scanner/*.service ops/scanner/*.timer
      - name: Private scanner Compose contract
        if: matrix.shard == 1
        env:
          OPENDISCORD_APP_PRIVATE_NETWORK: isolated-scanner-fixture
        run: |
          docker compose -f ops/scanner/compose.yml config --format json > /tmp/scanner-compose.json
          python3 scripts/check-scanner-compose.py /tmp/scanner-compose.json
      - run: pnpm lint
        if: matrix.shard == 1
      - run: pnpm typecheck
        if: matrix.shard == 1
      - run: pnpm db:migrate
      - name: Vitest shard
        env:
          SHARD: ${{ matrix.shard }}
        run: pnpm --filter web exec vitest run --shard="$SHARD/2"
      - name: Characterize isolated message read load
        if: matrix.shard == 2
        timeout-minutes: 3
        env:
          OPENDISCORD_ISOLATED_LOAD: "1"
        run: pnpm --filter web exec tsx scripts/characterize-load.ts
      - uses: actions/upload-artifact@v7
        if: matrix.shard == 2
        with:
          name: load-characterization
          path: apps/web/load-characterization.json
          if-no-files-found: error
      - name: Rehearse encrypted backup and isolated restore
        if: matrix.shard == 2
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          pnpm --filter web exec node scripts/verify-restore.mjs "${{ job.services.postgres.id }}"

  browser:
    strategy:
      # Keep every shard's diagnostics when another shard fails.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opendiscord
          POSTGRES_PASSWORD: opendiscord
          POSTGRES_DB: opendiscord
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opendiscord" --health-interval 5s --health-retries 10
    env:
      ATTACHMENT_DIR: /tmp/opendiscord-ci-attachments
      DATABASE_URL: postgres://opendiscord:opendiscord@localhost:5432/opendiscord
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
      # LiveKit in dev mode for voice tests (started below; integration tests only need the settings).
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore Next.js compiler cache
        uses: actions/cache/restore@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - run: pnpm db:migrate
      - run: pnpm build
      # Only main saves: per-PR saves pushed the repo past its 10 GB cache limit and evicted main's entries.
      - name: Save Next.js compiler cache
        if: github.ref == 'refs/heads/main' && matrix.shard == 1
        uses: actions/cache/save@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
      - name: Characterize isolated authenticated HTTP and SSE
        if: matrix.shard == 1
        timeout-minutes: 4
        env:
          OPENDISCORD_ISOLATED_LOAD: "1"
          BETTER_AUTH_URL: http://localhost:3300
          OPENDISCORD_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm --filter web exec tsx scripts/characterize-http-sse.ts
      - uses: actions/upload-artifact@v7
        if: always() && matrix.shard == 1
        with:
          name: http-sse-characterization
          path: apps/web/http-sse-characterization.json
          if-no-files-found: warn
          retention-days: 7
      - name: Start LiveKit (dev mode)
        id: livekit
        run: docker run -d --name opendiscord-ci-livekit --network host livekit/livekit-server:v1.13 --dev --bind 0.0.0.0 --node-ip 127.0.0.1
      - name: Voice maintenance real DB and SDK acceptance
        # Shard-independent; run it once on the lightest shard.
        if: matrix.shard == 3
        timeout-minutes: 3
        run: pnpm --filter web exec tsx scripts/verify-voice-maintenance.ts
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - name: Desktop and mobile browser shard
        env:
          SHARD: ${{ matrix.shard }}
          # Playwright splits shards by test count; voice-worker's many sub-second tests gave shard 1
          # ~2x the runtime of shard 3. Weights come from measured durations (PR #97, --reporter=list);
          # stale weights only skew balance, every test still runs on exactly one shard.
          PWTEST_SHARD_WEIGHTS: "2:4:5"
        run: pnpm --filter web exec playwright test --project=desktop --project=mobile --shard="$SHARD/3" --workers=2 --reporter=list --output=test-results/browser
      # Each shard owns its database. The instance-wide alpha switch runs only after
      # this runner's ordinary tests finish, with no other tests using that database.
      - name: Closed Alpha approval acceptance
        if: matrix.shard == 1
        run: pnpm --filter web exec playwright test --project=closed-alpha --no-deps --workers=1 --output=test-results/closed-alpha
      - name: LiveKit advertised address and listeners
        if: always() && steps.livekit.outcome == 'success'
        # Deliberately omit participant, SDP, ICE credential and token logs.
        run: docker logs opendiscord-ci-livekit 2>&1 | sed -n '/starting LiveKit server/p'
      - uses: actions/upload-artifact@v7
        # A failed initial attempt must survive a successful retry on disposable CI accounts.
        if: always()
        with:
          name: playwright-traces-${{ matrix.shard }}
          path: |
            apps/web/test-results/**/trace.zip
            apps/web/test-results/**/error-context.md
            apps/web/test-results/**/signup-diagnostics.json
            apps/web/test-results/**/community-scroll-diagnostic.json
            apps/web/test-results/**/error-context-initial-sync.md
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-screenshots-${{ matrix.shard }}
          path: apps/web/test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

  docker:
    # Recovery acceptance builds and exercises the same production web target.
    uses: ./.github/workflows/media-recovery.yml
