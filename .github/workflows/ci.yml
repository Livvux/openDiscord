name: CI

on:
  push: { branches: [main] }
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: opendiscord
          POSTGRES_PASSWORD: opendiscord
          POSTGRES_DB: opendiscord
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U opendiscord" --health-interval 5s --health-retries 10
    env:
      ATTACHMENT_DIR: /tmp/opendiscord-ci-attachments
      DATABASE_URL: postgres://opendiscord:opendiscord@localhost:5432/opendiscord
      BETTER_AUTH_SECRET: ci-secret-ci-secret-ci-secret-ci-secret
      BETTER_AUTH_URL: http://localhost:3000
      # LiveKit in dev mode for voice tests (started below; integration tests only need the settings).
      LIVEKIT_URL: ws://localhost:7880
      LIVEKIT_API_KEY: devkey
      LIVEKIT_API_SECRET: secret
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Restore Next.js compiler cache
        uses: actions/cache@v5
        with:
          path: apps/web/.next/cache
          key: ${{ runner.os }}-next-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-next-${{ github.workflow }}-${{ hashFiles('pnpm-lock.yaml') }}-
      - name: Production dependency license inventory
        run: node scripts/check-dependency-licenses.mjs
      - name: Dependency audit (production dependencies)
        run: pnpm audit --prod --audit-level=high
      - name: Operator job shell syntax
        run: bash -n scripts/production-backup.sh scripts/production-maintenance.sh scripts/production-voice-maintenance.sh scripts/secure-dokploy-env.sh
      - name: Operator alert state regression checks
        run: |
          python3 scripts/test-operator-monitor.py
          python3 scripts/test-capture-scanner-recovery.py
      - name: Voice operator wrapper isolation and cleanup
        run: python3 scripts/test-production-voice-maintenance.py
      - name: Voice systemd template verification
        run: |
          sudo install -m 755 /bin/true /usr/local/sbin/opendiscord-voice-maintenance
          sudo install -m 755 /bin/true /usr/local/sbin/opendiscord-operator-monitor
          systemd-analyze verify ops/voice-maintenance/*.service ops/voice-maintenance/*.timer ops/scanner/*.service ops/scanner/*.timer
      - name: Private scanner Compose contract
        env:
          OPENDISCORD_APP_PRIVATE_NETWORK: isolated-scanner-fixture
        run: |
          docker compose -f ops/scanner/compose.yml config --format json > /tmp/scanner-compose.json
          python3 scripts/check-scanner-compose.py /tmp/scanner-compose.json
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm db:migrate
      - run: pnpm test
      - name: Characterize isolated message read load
        timeout-minutes: 3
        env:
          OPENDISCORD_ISOLATED_LOAD: "1"
        run: pnpm --filter web exec tsx scripts/characterize-load.ts
      - uses: actions/upload-artifact@v7
        with:
          name: load-characterization
          path: apps/web/load-characterization.json
          if-no-files-found: error
      - name: Rehearse encrypted backup and isolated restore
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          pnpm --filter web exec node scripts/verify-restore.mjs "${{ job.services.postgres.id }}"
      - run: pnpm build
      - name: Characterize isolated authenticated HTTP and SSE
        timeout-minutes: 4
        env:
          OPENDISCORD_ISOLATED_LOAD: "1"
          BETTER_AUTH_URL: http://localhost:3300
          OPENDISCORD_SOURCE_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: pnpm --filter web exec tsx scripts/characterize-http-sse.ts
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: http-sse-characterization
          path: apps/web/http-sse-characterization.json
          if-no-files-found: warn
          retention-days: 7
      - name: Start LiveKit (dev mode)
        id: livekit
        run: docker run -d --name opendiscord-ci-livekit --network host livekit/livekit-server:v1.13 --dev --bind 0.0.0.0 --node-ip 127.0.0.1
      - name: Voice maintenance real DB and SDK acceptance
        timeout-minutes: 3
        run: pnpm --filter web exec tsx scripts/verify-voice-maintenance.ts
      - run: pnpm --filter web exec playwright install --with-deps chromium
      - run: pnpm --filter web test:e2e
      - name: LiveKit advertised address and listeners
        if: always() && steps.livekit.outcome == 'success'
        # Deliberately omit participant, SDP, ICE credential and token logs.
        run: docker logs opendiscord-ci-livekit 2>&1 | sed -n '/starting LiveKit server/p'
      - uses: actions/upload-artifact@v7
        # A failed initial attempt must survive a successful retry on disposable CI accounts.
        if: always()
        with:
          name: playwright-traces
          path: |
            apps/web/test-results/**/trace.zip
            apps/web/test-results/**/error-context.md
            apps/web/test-results/**/signup-diagnostics.json
            apps/web/test-results/**/community-scroll-diagnostic.json
            apps/web/test-results/**/error-context-initial-sync.md
          retention-days: 3
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: browser-screenshots
          path: apps/web/test-results/**/*.png
          retention-days: 7
          if-no-files-found: ignore

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          tags: opendiscord-web
          load: true
          cache-from: type=gha,scope=web-image
          cache-to: type=gha,mode=max,scope=web-image
