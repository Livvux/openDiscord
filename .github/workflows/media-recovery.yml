name: Media recovery acceptance
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
jobs:
  media-recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: 'true'
      OPENDISCORD_ISOLATED_MEDIA_RECOVERY: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Install isolated recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y rclone restic
          pnpm --filter web exec playwright install --with-deps chromium
      - uses: docker/setup-buildx-action@v4
      - name: Build actual production web image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: web
          build-args: SOURCE_COMMIT=${{ github.sha }}
          tags: opendiscord-media-recovery:${{ github.run_id }}-${{ github.run_attempt }}
          load: true
          cache-from: type=gha,scope=media-recovery-image
          # PR runs only read the layer cache; per-PR blobs evicted main's caches.
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max,scope=media-recovery-image' || '' }}
      - name: Verify the built image's source revision
        env:
          SOURCE_COMMIT: ${{ github.sha }}
          RELEASE_IMAGE: opendiscord-media-recovery:${{ github.run_id }}-${{ github.run_attempt }}
        run: test "$(docker image inspect "$RELEASE_IMAGE" --format '{{index .Config.Labels "org.opencontainers.image.revision"}}')" = "$SOURCE_COMMIT"
      - name: Rehearse exact operational archive with private media
        run: pnpm --filter web exec node scripts/verify-media-recovery.mjs
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: media-recovery-summary
          path: apps/web/media-recovery-summary.json
          if-no-files-found: error
          retention-days: 7
