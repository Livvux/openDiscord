<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="robots" content="noindex">
<title>Offline · openDiscord</title>
<style>
  :root { color-scheme: dark; }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: #0f172a; color: #e2e8f0;
    font: 16px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
  main { max-width: 26rem; padding: 1.5rem; text-align: center; }
  h1 { font-size: 1.375rem; margin: 0 0 .5rem; color: #fff; }
  p { margin: 0 0 1.25rem; color: #cbd5e1; }
  a { display: inline-block; padding: .625rem 1.25rem; border-radius: .5rem; background: #6366f1; color: #fff; font-weight: 600; text-decoration: none; }
  a:focus-visible { outline: 3px solid #69ebbd; outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>You're offline</h1>
  <p>openDiscord needs a connection. Messages are not stored on this device for offline reading, so nothing is shown until you reconnect.</p>
  <a href="/app">Try again</a>
</main>
</body>
</html>
