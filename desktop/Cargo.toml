[package]
name = "opendiscord-desktop"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"
publish = false

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
url = "2"
open = "5"
# Without the default "zip" feature: only legacy v1 Windows .zip bundles need it, and zip 4 has RUSTSEC-2026-0367..0369.
tauri-plugin-updater = { version = "2", default-features = false, features = ["rustls-tls", "system-proxy"] }
serde_json = "1"
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17", default-features = false }
