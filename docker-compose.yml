# Production / self-hosting stack. Configure via .env (see .env.example).
services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: opendiscord
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: opendiscord
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendiscord"]
      interval: 5s
      retries: 10

  migrate:
    build: { context: ., target: migrate }
    environment:
      DATABASE_URL: postgres://opendiscord:${POSTGRES_PASSWORD}@db:5432/opendiscord
    depends_on:
      db: { condition: service_healthy }

  web:
    build: { context: ., target: web }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://opendiscord:${POSTGRES_PASSWORD}@db:5432/opendiscord
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET}
      BETTER_AUTH_SECRETS: ${BETTER_AUTH_SECRETS:-}
      BETTER_AUTH_URL: https://${DOMAIN:-localhost}
      MINIMUM_AGE: ${MINIMUM_AGE:-16}
      OPERATOR_NAME: ${OPERATOR_NAME:-}
      OPERATOR_ADDRESS: ${OPERATOR_ADDRESS:-}
      OPERATOR_COUNTRY: ${OPERATOR_COUNTRY:-}
      OPERATOR_EMAIL: ${OPERATOR_EMAIL:-}
      SMTP_URL: ${SMTP_URL:-}
      MAIL_FROM: ${MAIL_FROM:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-}
      ATTACHMENT_DIR: ${ATTACHMENT_DIR:-}
      CLAMAV_HOST: ${CLAMAV_HOST:-}
      CLAMAV_PORT: ${CLAMAV_PORT:-3310}
      R2_ENDPOINT: ${R2_ENDPOINT:-}
      R2_BUCKET: ${R2_BUCKET:-}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-}
      LIVEKIT_URL: ${LIVEKIT_URL:-}
      LIVEKIT_API_KEY: ${LIVEKIT_API_KEY:-}
      LIVEKIT_API_SECRET: ${LIVEKIT_API_SECRET:-}
      # Server-to-server API calls (removing people from rooms) stay on the private network.
      LIVEKIT_API_URL: http://livekit:7880
    depends_on:
      migrate: { condition: service_completed_successfully }

  # Optional voice SFU: `docker compose --profile voice up -d`. Media needs these ports reachable
  # from the internet: 7881/tcp and 7882/udp. Signalling goes through Caddy at /livekit.
  livekit:
    image: livekit/livekit-server:v1.13
    profiles: [voice]
    restart: unless-stopped
    command: --config /etc/livekit.yaml
    environment:
      # Both must be set when using this profile; LiveKit refuses to start with an empty or short secret.
      LIVEKIT_KEYS: "${LIVEKIT_API_KEY:-}: ${LIVEKIT_API_SECRET:-}"
    volumes:
      - ./livekit.yaml:/etc/livekit.yaml:ro
    ports: ["7881:7881", "7882:7882/udp"]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      DOMAIN: ${DOMAIN:-localhost}
      TRUSTED_PROXIES: ${TRUSTED_PROXIES:-private_ranges}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on: [web]

volumes:
  pgdata:
  caddy_data:
